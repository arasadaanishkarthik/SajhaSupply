<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SajhaSupply</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var repo = pathSegments[0] || 'SajhaSupply';
      window.location.replace('/' + repo + '/');
    </script>
  </head>
  <body>
    <p>Redirecting to SajhaSupply...</p>
  </body>
</html>
